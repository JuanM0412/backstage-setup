name: AWS Infrastructure

on:
  push:
    paths:
      - infra/aws/**
      - .github/workflows/infrastructure-aws.yml
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform plan
        required: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-2
  TF_STATE_KEY: backstage/terraform.tfstate

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: aws-infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform init
        working-directory: infra/aws
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET repository variable is required"
            exit 1
          fi
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/aws

      - name: Terraform validate
        working-directory: infra/aws
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request' || inputs.apply != true
        working-directory: infra/aws
        env:
          TF_VAR_github_repository: ${{ github.repository }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        working-directory: infra/aws
        env:
          TF_VAR_github_repository: ${{ github.repository }}
        run: terraform apply -auto-approve
