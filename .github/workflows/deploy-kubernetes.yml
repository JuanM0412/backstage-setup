name: Deploy Backstage to Kubernetes

on:
  push:
    branches:
      - master
    paths-ignore:
      - infra/aws/**
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: backstage
  EKS_CLUSTER_NAME: backstage

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: backstage-production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:backend
          docker build \
            --tag "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            -f packages/backend/Dockerfile .
          docker push "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Update Kubernetes resources
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BACKSTAGE_DATABASE_URL: ${{ secrets.BACKSTAGE_DATABASE_URL }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          if [ -z "$BACKSTAGE_DATABASE_URL" ]; then
            echo "::error::BACKSTAGE_DATABASE_URL secret is required"
            exit 1
          fi
          if [ -z "$APP_BASE_URL" ]; then
            APP_BASE_URL="http://localhost"
            echo "::warning::APP_BASE_URL is not configured; using http://localhost for bootstrap"
          fi
          if [ -z "$BACKEND_BASE_URL" ]; then
            BACKEND_BASE_URL="http://localhost"
            echo "::warning::BACKEND_BASE_URL is not configured; using http://localhost for bootstrap"
          fi
          escape_sed_replacement() {
            printf '%s' "$1" | sed 's/[&|]/\\&/g'
          }
          app_base_url="$(escape_sed_replacement "$APP_BASE_URL")"
          backend_base_url="$(escape_sed_replacement "$BACKEND_BASE_URL")"
          kubectl apply -f deploy/k8s/namespace.yaml
          sed \
            -e "s|__APP_BASE_URL__|$app_base_url|g" \
            -e "s|__BACKEND_BASE_URL__|$backend_base_url|g" \
            deploy/k8s/configmap.yaml | kubectl apply -f -
          kubectl -n backstage create secret generic backstage-database \
            --from-literal=POSTGRESQL_ADDON_URI="$BACKSTAGE_DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s#BACKSTAGE_IMAGE#$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}#" \
            deploy/k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/ingress.yaml
          kubectl -n backstage rollout status deployment/backstage --timeout=5m
