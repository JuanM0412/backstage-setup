name: Deploy Backstage to Kubernetes

on:
  push:
    branches:
      - main
    paths-ignore:
      - infra/aws/**
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backstage
  EKS_CLUSTER_NAME: backstage

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: backstage-production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:backend
          docker build \
            --tag "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            -f packages/backend/Dockerfile .
          docker push "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Update Kubernetes resources
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BACKSTAGE_DATABASE_URL: ${{ secrets.BACKSTAGE_DATABASE_URL }}
        run: |
          if [ -z "$BACKSTAGE_DATABASE_URL" ]; then
            echo "::error::BACKSTAGE_DATABASE_URL secret is required"
            exit 1
          fi
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/configmap.yaml
          kubectl -n backstage create secret generic backstage-database \
            --from-literal=POSTGRESQL_ADDON_URI="$BACKSTAGE_DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s#BACKSTAGE_IMAGE#$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}#" \
            deploy/k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/ingress.yaml
          kubectl -n backstage rollout status deployment/backstage --timeout=5m
