apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: BACKSTAGE_IMAGE
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: POSTGRESQL_ADDON_URI
              valueFrom:
                secretKeyRef:
                  name: backstage-database
                  key: POSTGRESQL_ADDON_URI
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-github
                  key: GITHUB_TOKEN
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backstage-config
                  key: APP_BASE_URL
            - name: BACKEND_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backstage-config
                  key: BACKEND_BASE_URL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
