name: Build Validation

on:
  pull_request:
    branches:
      - main
      - develop
      - release
  push:
    branches:
      - main
      - develop
      - release
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

{% if values.language == 'nodejs' %}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Node.js service
        run: |
          npm install
          npm test
{% else %}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Test Python service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest
{% endif %}

      - name: SonarCloud Scan
        if: {% raw %}${{ vars.SONAR_ENABLED == 'true' }}{% endraw %}
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.projectKey=backstage-backend_{% raw %}${{ github.event.repository.name }}{% endraw %}
            -Dsonar.organization=backstage-backend
        env:
          GITHUB_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
          SONAR_TOKEN: {% raw %}${{ secrets.SONAR_TOKEN }}{% endraw %}
          SONAR_HOST_URL: {% raw %}${{ vars.SONAR_HOST_URL }}{% endraw %}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Run Terraform validation
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

{% if values.deployment == 'kubernetes' %}
      - name: Build container
        run: docker build --tag "{% raw %}${{ github.repository }}:${{ github.sha }}{% endraw %}" .
{% endif %}
