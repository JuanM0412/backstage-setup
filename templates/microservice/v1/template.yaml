apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: microservice-v1
  title: Create a microservice (v1)
  description: Version 1 of the microservice template with a REST API and Dockerfile.
  annotations:
    platform.wenia.com/template: microservice
    platform.wenia.com/template-version: '1'
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Service Information
      required:
        - name
        - teamOwner
        - apiName
        - apiPath
        - language
        - deployment
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        teamOwner:
          title: Team Owner
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Group
        apiName:
          title: API name
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        apiPath:
          title: API base path
          type: string
          default: items
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          title: Description
          type: string
          minLength: 10
        language:
          title: Language
          type: string
          enum:
            - nodejs
            - python
          enumNames:
            - Node.js
            - Python
        deployment:
          title: Deployment
          type: string
          enum:
            - lambda
            - kubernetes
          enumNames:
            - Lambda
            - Kubernetes

  steps:
    - id: fetch-common
      name: Generate common files
      action: fetch:template
      input:
        url: ./common
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.teamOwner }}
          apiName: ${{ parameters.apiName }}
          apiPath: ${{ parameters.apiPath }}
          language: ${{ parameters.language }}
          deployment: ${{ parameters.deployment }}
          description: ${{ parameters.description }}

    - id: fetch-nodejs
      name: Generate Node.js files
      if: ${{ parameters.language == 'nodejs' }}
      action: fetch:template
      input:
        url: ./nodejs
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          apiPath: ${{ parameters.apiPath }}
          language: ${{ parameters.language }}

    - id: fetch-python
      name: Generate Python files
      if: ${{ parameters.language == 'python' }}
      action: fetch:template
      input:
        url: ./python
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          apiPath: ${{ parameters.apiPath }}
          language: ${{ parameters.language }}

    - id: fetch-kubernetes
      name: Generate Kubernetes files
      if: ${{ parameters.deployment == 'kubernetes' }}
      action: fetch:template
      input:
        url: ./kubernetes
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}

    - id: fetch-lambda
      name: Generate lambda files
      if: ${{ parameters.deployment == 'lambda' }}
      action: fetch:template
      input:
        url: ./lambda
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          language: ${{ parameters.language }}

    - id: validate-repository
      name: Validate repository name is available
      action: github:repo:validate-available
      input:
        repoUrl: github.com?owner=backstage-backend&repo=${{ parameters.name }}

    - id: publish
      name: Publish repository
      action: publish:github
      input:
        repoUrl: github.com?owner=backstage-backend&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public

    - id: create-branches
      name: Create development branches
      action: github:branches:create
      input:
        repoUrl: github.com?owner=backstage-backend&repo=${{ parameters.name }}
        branches:
          - develop
          - release

    - id: protect-main
      name: Protect main branch
      action: github:branch-protection:create
      input:
        repoUrl: github.com?owner=backstage-backend&repo=${{ parameters.name }}
        branch: main
        requiredApprovingReviewCount: 1
        requiredStatusCheckContexts:
          - Build Validation / build-and-test
        requireBranchesToBeUpToDate: true
        requiredConversationResolution: true

    - id: protect-develop
      name: Protect develop branch
      action: github:branch-protection:create
      input:
        repoUrl: github.com?owner=backstage-backend&repo=${{ parameters.name }}
        branch: develop
        requiredApprovingReviewCount: 1
        requiredStatusCheckContexts:
          - Build Validation / build-and-test
        requireBranchesToBeUpToDate: true
        requiredConversationResolution: true

    - id: protect-release
      name: Protect release branch
      action: github:branch-protection:create
      input:
        repoUrl: github.com?owner=backstage-backend&repo=${{ parameters.name }}
        branch: release
        requiredApprovingReviewCount: 1
        requiredStatusCheckContexts:
          - Build Validation / build-and-test
        requireBranchesToBeUpToDate: true
        requiredConversationResolution: true

    - id: register
      name: Register component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
